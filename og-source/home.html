<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Play By Ear — OG Source</title>
    <link rel="stylesheet" href="og.css">
</head>
<body>
    <main class="og-card">
        <header class="topline">
            <p class="eyebrow">Play By Ear · Emerging Technology</p>
            <p class="domain">playbyear.xyz</p>
        </header>

        <section class="copy">
            <h1>Fractional GTM.<br><em>Event hosting.</em></h1>
            <p class="description">Senior strategy and hands-on execution for emerging-tech launches—and a technically fluent human on the mic.</p>
            <div class="services" aria-label="Services">
                <span>Fractional GTM</span>
                <span>GTM Agency</span>
                <span>Hosting &amp; MCing</span>
            </div>
        </section>

        <div class="soft-visual" aria-hidden="true">
            <i class="orbit"></i>
            <i class="axis"></i>
            <i class="axis secondary"></i>
            <i class="node node-a"></i>
            <i class="node node-b"></i>
            <i class="node node-c"></i>
            <i class="node node-d"></i>
            <span class="visual-label">Strategy / Stage</span>
        </div>

        <i class="corner-rule" aria-hidden="true"></i>
    </main>
</body>
</html>
