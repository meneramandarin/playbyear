<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Play By Ear GTM — OG Source</title>
    <link rel="stylesheet" href="og.css">
</head>
<body>
    <main class="og-card gtm-card">
        <header class="topline">
            <p class="eyebrow">Fractional GTM · GTM Agency</p>
            <p class="domain">playbyear.xyz/gtm</p>
        </header>

        <section class="copy">
            <h1>Make the market understand<br><em>what you’re building.</em></h1>
            <p class="description">Positioning, launch strategy, ecosystem campaigns, and senior GTM capacity for emerging-technology teams.</p>
            <div class="services" aria-label="Services">
                <span>Positioning</span>
                <span>Launches</span>
                <span>Ecosystem Campaigns</span>
            </div>
        </section>

        <div class="soft-visual" aria-hidden="true">
            <i class="orbit"></i>
            <i class="axis"></i>
            <i class="axis secondary"></i>
            <i class="node node-a"></i>
            <i class="node node-b"></i>
            <i class="node node-c"></i>
            <i class="node node-d"></i>
            <span class="visual-label">Narrative / Launch</span>
        </div>

        <i class="corner-rule" aria-hidden="true"></i>
    </main>
</body>
</html>
